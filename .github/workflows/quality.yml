name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run secrets:check
      - run: npm run lint
      - run: npm test
      - run: npm run build:all
      - run: npm run audit:production

  # Isolation guarantees are worth nothing if nothing re-checks them. The
  # predecessor left db:rls:check as a manual step and it drifted. Runs
  # whenever the disposable-branch owner credential is configured, so there is
  # no manual flag to forget to turn on.
  isolation:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERIFY_DATABASE_URL_OWNER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:verify
        env:
          # Owner credential for a DISPOSABLE branch. The checks write and then
          # roll back, so this must never point at production.
          DATABASE_URL_OWNER: ${{ secrets.VERIFY_DATABASE_URL_OWNER }}
